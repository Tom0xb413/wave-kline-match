<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0e11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>WAVE · 波形终端</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        function layout() {
          var mobile =
            window.matchMedia("(max-width: 900px)").matches ||
            (window.matchMedia("(pointer: coarse)").matches &&
              window.matchMedia("(max-width: 1100px)").matches);
          document.documentElement.setAttribute("data-layout", mobile ? "mobile" : "desktop");
        }
        layout();
        window.addEventListener("resize", layout);
        window.addEventListener("orientationchange", layout);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
