# V1 匹配宇宙。primary 仅表示入库优先级与匹配读取的主序列，不加权相似度。
# native_symbol 可为字符串或候选列表；Gate 会对照交易对/合约列表解析，禁止盲写不存在的合约。

timeframes: [1H, 4H, 12H, 1D]
default_n: 30
topk: 10

# 历史深度（尽力而为）。1D 拉全量。
depths:
  1H: 2y
  4H: 3y
  12H: 5y
  1D: full

assets:
  # ---- 加密货币：Binance USDT 现货为主序列 ----
  - id: BTC
    class: crypto
    venues:
      - {venue: binance, native_symbol: BTCUSDT, primary: true}
      - {venue: okx, native_symbol: BTC-USDT, primary: false}
      - {venue: gate, native_symbol: BTC_USDT, primary: false}

